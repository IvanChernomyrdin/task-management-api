openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
  description: REST API for team-based task management, audited updates, MySQL reporting and Redis list caching.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Teams
  - name: Tasks
  - name: Reports
paths:
  /health:
    get:
      summary: Check MySQL and Redis readiness
      security: []
      responses:
        "200":
          {
            description: Healthy,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { status: { type: string, example: ok } },
                      },
                  },
              },
          }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/register:
    post:
      tags: [Auth]
      summary: Register an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  { type: string, format: email, example: alice@example.com }
                password:
                  {
                    type: string,
                    format: password,
                    minLength: 8,
                    maxLength: 72,
                    example: secret123,
                  }
                name: { type: string, maxLength: 120, example: Alice }
      responses:
        "201":
          {
            description: Registered user,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/User" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/login:
    post:
      tags: [Auth]
      summary: Obtain JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: JWT access token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 86400 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/teams:
    post:
      tags: [Teams]
      summary: Create team and owner membership atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 150, example: Platform Team }
      responses:
        "201":
          {
            description: Created team,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Team" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [Teams]
      summary: List teams visible to current user
      responses:
        "200":
          {
            description: Team list,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Team" },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/teams/{id}/invite:
    post:
      tags: [Teams]
      summary: Invite existing user (owner/admin)
      description: Admin may invite members; owner may invite members or admins; owner role cannot be granted by invite.
      parameters:
        - { $ref: "#/components/parameters/TeamID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, format: int64, minimum: 1 }
                role: { type: string, enum: [member, admin], default: member }
      responses:
        "201":
          {
            description: Member added,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Success" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/teams/{id}/members/{user_id}/role:
    put:
      tags: [Teams]
      summary: Change team member role (owner only)
      description: Owner cannot be modified; role owner cannot be assigned.
      parameters:
        - { $ref: "#/components/parameters/TeamID" }
        - name: user_id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, member] }
      responses:
        "200":
          {
            description: Updated,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Success" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tasks:
    post:
      tags: [Tasks]
      summary: Create task with audit entry in a single transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTask" }
      responses:
        "201":
          {
            description: Task created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Task" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Tasks]
      summary: Team-scoped task list with filter-based Redis caching (5 minutes)
      parameters:
        - name: team_id
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/Status" }
        - name: assignee_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0, maximum: 1000000 }
      responses:
        "200":
          {
            description: Paginated task list,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/TaskPage" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tasks/{id}:
    put:
      tags: [Tasks]
      summary: Update task atomically with history and optimistic version check
      description: Creator/owner/admin can edit task fields; assignee can edit status only. Provide version received from a previous read.
      parameters:
        - { $ref: "#/components/parameters/TaskID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTask" }
      responses:
        "200":
          {
            description: Updated task,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Task" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/tasks/{id}/history:
    get:
      tags: [Tasks]
      summary: Read task history (team members only)
      parameters:
        - { $ref: "#/components/parameters/TaskID" }
      responses:
        "200":
          {
            description: Audit entries,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/History" },
                      },
                  },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tasks/{id}/comments:
    post:
      tags: [Tasks]
      summary: Comment on task (team members only)
      parameters:
        - { $ref: "#/components/parameters/TaskID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 5000 }
      responses:
        "201":
          {
            description: Comment created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Comment" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Tasks]
      summary: Read task comments (team members only)
      parameters:
        - { $ref: "#/components/parameters/TaskID" }
      responses:
        "200":
          {
            description: Comments,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Comment" },
                      },
                  },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/teams/{team_id}/stats:
    get:
      tags: [Reports]
      summary: Team statistics, available to owner and admin only
      parameters:
        - name: team_id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          {
            description: SQL report for one team,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Stats" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    TeamID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    TaskID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_input
              message: invalid input

    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: invalid credentials

    Forbidden:
      description: Insufficient privileges
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: access denied

    NotFound:
      description: Resource not found or not visible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: resource not found

    Conflict:
      description: Duplicate or version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: resource already exists or version mismatch

    Unavailable:
      description: Database or Redis unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unavailable
              message: service unavailable
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message:
              {
                type: string,

              }
    Success:
      type: object
      properties:
        status: { type: string }
    Status: { type: string, enum: [todo, in_progress, done] }
    Role: { type: string, enum: [owner, admin, member] }
    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Team:
      type: object
      required: [id, name, created_by, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        role: { $ref: "#/components/schemas/Role" }
    Task:
      type: object
      required:
        [
          id,
          team_id,
          title,
          description,
          status,
          created_by,
          created_at,
          updated_at,
          version,
        ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        created_by: { type: integer, format: int64 }
        assignee_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64 }
    CreateTask:
      type: object
      required: [team_id, title]
      properties:
        team_id: { type: integer, format: int64, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000, default: "" }
        status: { $ref: "#/components/schemas/Status" }
        assignee_id: { type: integer, format: int64, nullable: true }
    UpdateTask:
      type: object
      required: [expected_version]
      description: At least one mutable field must be provided. Null assignee_id clears assignment.
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        status: { $ref: "#/components/schemas/Status" }
        assignee_id: { type: integer, format: int64, nullable: true }
    TaskPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Task" } }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    History:
      type: object
      required: [id, task_id, changed_by, changes, created_at]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        changed_by: { type: integer, format: int64 }
        changes:
          {
            type: object,
            additionalProperties: true,
            description: "Field name to {old,new} values, or created event",
          }
        created_at: { type: string, format: date-time }
    Comment:
      type: object
      required: [id, task_id, user_id, content, created_at]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        content: { type: string }
        created_at: { type: string, format: date-time }
    Stats:
      type: object
      required: [team_id, by_status, top_assignees_last_30_days, comments_count]
      properties:
        team_id: { type: integer, format: int64 }
        by_status:
          type: object
          properties:
            todo: { type: integer, format: int64 }
            in_progress: { type: integer, format: int64 }
            done: { type: integer, format: int64 }
        top_assignees_last_30_days:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              user_id: { type: integer, format: int64 }
              name: { type: string }
              closed_count: { type: integer, format: int64 }
        average_closure_seconds:
          {
            type: number,
            format: double,
            nullable: true,
            description: Null when no tasks were closed,
          }
        comments_count: { type: integer, format: int64 }
